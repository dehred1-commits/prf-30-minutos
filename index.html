<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Estudo de 30 minutos por dia para o concurso da PRF: itens certo/errado no estilo Cebraspe, simulados com nota líquida, provas oficiais com correção e padrões da banca.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PRF 30">
<meta name="theme-color" content="#f2f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1210" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>PRF em 30 minutos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: uma coluna de celular (máx. 560px). Linguagem da rodovia: verde das placas de direção, amarelo da faixa central como marca-texto, cartão-resposta Certo/Errado do Cebraspe. */
:root{
  --paper:#f2f5f3; --card:#ffffff; --ink:#13201a; --muted:#56655d; --line:#d5ddd8;
  --pen:#0b6b45; --pen-soft:#e1f1e8; --on-pen:#ffffff;
  --mark:#ffd62e; --mark-ink:#13201a;
  --ok:#1c7c4a; --ok-soft:#e1f3e8; --bad:#c0352b; --bad-soft:#fbe7e5;
  --shadow:rgba(11,107,69,.22);
  --f-ui:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0c1210; --card:#141d19; --ink:#e6ede9; --muted:#97a69e; --line:#27342e;
    --pen:#5fd39a; --pen-soft:#163a2a; --on-pen:#0c1210;
    --mark:#5c4b07; --mark-ink:#fff3c2;
    --ok:#56cc8e; --ok-soft:#12301f; --bad:#ff8174; --bad-soft:#3b1a17;
    --shadow:rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c1210; --card:#141d19; --ink:#e6ede9; --muted:#97a69e; --line:#27342e;
  --pen:#5fd39a; --pen-soft:#163a2a; --on-pen:#0c1210;
  --mark:#5c4b07; --mark-ink:#fff3c2;
  --ok:#56cc8e; --ok-soft:#12301f; --bad:#ff8174; --bad-soft:#3b1a17;
  --shadow:rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--pen)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:20px 120px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.hero h1{font-size:clamp(2.4rem,11vw,3.3rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.hero h1 .n{color:var(--pen);font-variant-numeric:tabular-nums}
.hero .sub{color:var(--muted);font-size:1rem}
.hero .sub2{font-size:.95rem;margin-top:4px}
.h1-sm{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.h-sm{font-size:1.02rem;font-weight:700}
.meta{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.today-card{border:1.5px solid var(--pen);box-shadow:0 14px 30px -22px var(--shadow)}
.today-card h2{font-size:1.3rem;font-weight:700;line-height:1.2}
.done-line{color:var(--ok);font-weight:600}
.primary{appearance:none;border:0;background:var(--pen);color:var(--on-pen);font:600 1rem/1.2 var(--f-ui);padding:14px 18px;border-radius:12px;width:100%;min-height:48px;cursor:pointer}
.primary:disabled{opacity:.4;cursor:default}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--pen);border:1.5px solid var(--pen);font:600 1rem/1.2 var(--f-ui);padding:12px 16px;border-radius:12px;min-height:46px;text-decoration:none;cursor:pointer;width:100%}
.link{appearance:none;background:none;border:0;padding:6px 0;color:var(--pen);font:600 .95rem var(--f-ui);text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:flex-start}
.danger{color:var(--bad)}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
small{font-size:.78rem;color:var(--muted);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type="date"]{font:500 16px var(--f-ui);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}

/* calendário */
.cal-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.75rem;color:var(--muted);align-items:center}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);margin-right:4px;vertical-align:-2px}
.lg.done{background:var(--pen);border-color:var(--pen)}
.lg.today{outline:2px solid var(--ink);outline-offset:0}
.lg.exam{background:var(--mark);border-color:transparent}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wh{font:600 .68rem var(--f-mono);color:var(--muted);text-align:center}
.d{aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);font:500 .8rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.d.done{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.d.future{border-style:dashed}
.d.today{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}
.d.done.today{color:var(--on-pen)}
.d.exam{background:var(--mark);color:var(--mark-ink);border-color:transparent;font-weight:700}
.d[data-m]::after{content:attr(data-m);font-size:.5rem;letter-spacing:.04em;margin-top:2px;text-transform:uppercase}

.tip .tiptx{font-family:var(--f-read);font-size:1.05rem;line-height:1.55}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.steps input{width:22px;height:22px;flex:none;margin:2px 0 0;accent-color:var(--pen)}
.steps label{min-width:0}
.aspectos{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:.95rem}

/* item */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.qprog{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font:600 .78rem var(--f-mono);color:var(--muted)}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--pen);border-radius:99px}
.timer{font:600 .9rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);min-width:4.5em;text-align:right}
.q{display:flex;flex-direction:column;gap:14px}
.chip{display:inline-block;font:600 .64rem var(--f-mono);letter-spacing:.06em;background:var(--mark);color:var(--mark-ink);padding:2px 6px;border-radius:4px;vertical-align:1px}
.ctx{margin:0;font-family:var(--f-read);font-size:.98rem;line-height:1.6;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 12px;overflow-wrap:anywhere}
.item{margin:0;font-family:var(--f-read);font-size:1.08rem;line-height:1.62;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-wrap:anywhere}
mark{color:var(--mark-ink);background-color:transparent;background-image:linear-gradient(var(--mark),var(--mark));background-repeat:no-repeat;background-size:100% 100%;padding:0 .12em;border-radius:.15em;-webkit-box-decoration-break:clone;box-decoration-break:clone;animation:sweep .8s ease-out both}
@keyframes sweep{from{background-size:0% 100%}to{background-size:100% 100%}}
.ce-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ce-row.three{grid-template-columns:1fr 1fr .8fr}
.ce{appearance:none;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 1.05rem var(--f-ui);cursor:pointer;padding:0 8px}
.ce .k{font:600 .8rem var(--f-mono);width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center}
.ce.blank{font-weight:600;font-size:.92rem;color:var(--muted)}
.ce.sel{border-color:var(--pen);background:var(--pen);color:var(--on-pen)}
.ce.right{border-color:var(--ok);background:var(--ok);color:var(--on-pen)}
.ce.wrong{border-color:var(--bad);background:var(--bad);color:var(--on-pen)}
.ce:disabled{cursor:default}
.ce.dim{opacity:.5}
.chute{display:flex;align-items:center;gap:10px;font-size:.95rem;color:var(--muted)}
.chute input{width:22px;height:22px;accent-color:var(--pen)}
.simnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.fb h3{font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:8px}
.verdict{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem}
.dot{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--on-pen);background:var(--ok);font-size:.9rem}
.is-bad .dot{background:var(--bad)}
.sw{display:inline-block;width:18px;height:10px;background:var(--mark);border-radius:2px}
.end h1{font-size:3rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.reslist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.reslist li{display:flex;gap:8px;align-items:baseline}
.reslist .ok b{color:var(--ok)} .reslist .bad b{color:var(--bad)} .reslist .nil b{color:var(--muted)}
.score-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.st{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;display:flex;flex-direction:column}
.st b{font:600 1.2rem var(--f-mono);font-variant-numeric:tabular-nums} .st span{font-size:.72rem;color:var(--muted)}
.st.ok b{color:var(--ok)} .st.bad b{color:var(--bad)}
.rev details{border-top:1px solid var(--line);padding:0}
.rev summary{padding:10px 0;font-weight:600;font-size:.95rem;display:flex;gap:8px;align-items:baseline;cursor:pointer;list-style:none}
.rev summary::-webkit-details-marker{display:none}
.rev summary .tag{font:600 .7rem var(--f-mono);padding:2px 6px;border-radius:4px;flex:none}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.nil{background:var(--line);color:var(--muted)}
.rev .body{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;font-size:.95rem}
.rev .body .item{font-size:.98rem;padding:12px}

/* provas */
.eds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ed{appearance:none;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.ed-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ed-top b{font-size:1.05rem}
.ed-prog{font:500 .78rem var(--f-mono);color:var(--muted)}
.links{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 .85rem var(--f-mono);padding:8px 12px;border-radius:99px;cursor:pointer;min-height:40px}
.chip-btn.done{color:var(--ok)}
.chip-btn.on{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.cartao-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.crows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.crow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crow:last-child{border-bottom:0}
.qn{font:600 .9rem var(--f-mono);width:2.1em;font-variant-numeric:tabular-nums}
.qs{font:500 .68rem var(--f-mono);color:var(--muted);width:3.6em;text-transform:uppercase;letter-spacing:.03em}
.bubs{display:flex;gap:8px}
.bub-btn{appearance:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;color:var(--ink);font:600 .9rem var(--f-mono);cursor:pointer;padding:0}
.bub-btn:disabled{cursor:default}
.bub-btn.sel{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.bub-btn.right{background:var(--ok);border-color:var(--ok);color:var(--on-pen)}
.bub-btn.wrong{background:var(--bad);border-color:var(--bad);color:var(--on-pen)}
.crow.is-bad .qn{color:var(--bad)} .crow.is-ok .qn{color:var(--ok)}
.anul{font:500 .7rem var(--f-mono);color:var(--muted)}
.big-score{font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.big-score span{font-size:1.05rem;font-weight:600;color:var(--muted)}
.tipline{font-size:.92rem;border-left:3px solid var(--mark);padding-left:10px}
.blocks{display:flex;flex-direction:column;gap:6px}
.blk{display:flex;justify-content:space-between;gap:10px;font-size:.93rem}
.blk .num.okc{color:var(--ok)} .blk .num.badc{color:var(--bad)}

/* padrões e progresso */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{color:var(--muted);font-size:.85rem}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.num{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;min-width:360px}
.tbl th{font:600 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl th.n{text-align:right}
.list{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:6px}
details.mat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 16px}
details.mat summary{cursor:pointer;padding:13px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
details.mat summary::-webkit-details-marker{display:none}
details.mat summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details.mat[open] summary::after{content:"−"}
details.mat summary small{margin-left:auto}
details.mat > ul{margin:0 0 14px;padding-left:1.15em;display:flex;flex-direction:column;gap:5px;font-size:.95rem}
.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plain li{display:flex;justify-content:space-between;gap:10px}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.nav button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 .85rem var(--f-ui);padding:10px 2px;border-radius:10px;cursor:pointer;min-height:44px}
.nav button[aria-current="page"]{background:var(--pen-soft);color:var(--pen)}
@media (prefers-reduced-motion: reduce){mark{animation:none}}
</style>

</head>
<body>
<main id="app" class="wrap"></main>
<nav id="nav" class="nav" aria-label="Seções">
  <div class="in">
    <button data-tab="hoje">Hoje</button>
    <button data-tab="simulados">Simulados</button>
    <button data-tab="padroes">Padrões</button>
    <button data-tab="progresso">Progresso</button>
  </div>
</nav>

<script>
document.documentElement.lang = 'pt-BR';

const CDN = 'https://cdn.cebraspe.org.br/concursos/';
const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MAT = {T:'Legislação de trânsito',P:'Português',R:'Raciocínio lógico',N:'Informática',F:'Física',E:'Ética',G:'Geopolítica',I:'Língua estrangeira',
  A:'Direito Administrativo',C:'Direito Constitucional',D:'Direito Penal',K:'Processo Penal',L:'Legislação especial',H:'Direitos Humanos'};
const ABR = {T:'Trân',P:'Port',R:'RLM',N:'Info',F:'Fís',E:'Ética',G:'Geo',I:'Ing',A:'Adm',C:'Const',D:'Penal',K:'PPen',L:'Esp',H:'DH'};
const ORDEM = ['T','P','R','N','F','E','G','I','A','C','D','K','L','H'];
const BLOCO_DE = {P:1,R:1,N:1,F:1,E:1,G:1,I:1,T:2,A:3,C:3,D:3,K:3,L:3,H:3};
const SEG_ITEM = 105; // 4h30 de prova, 1h para a discursiva: sobra cerca de 1min45 por item

// Gabaritos definitivos do Cebraspe (C, E; X = anulado, ponto para todos) e matéria por faixa de itens, lida dos cadernos.
const EDS = [
  {id:'2021',nome:'PRF 2021',data:'',k:'XCECECCECECCCEECCECEEEECECCEEECCEECCEEXCEECEXECCECCECCECCEECEECCCEXEXECCEEEXCEECEEXCEEEEXCECECCECXXEECECECEECECCCCECECCE',
   faixas:[[1,8,'I'],[9,26,'P'],[27,32,'R'],[33,39,'N'],[40,45,'F'],[46,50,'E'],[51,55,'G'],[56,85,'T'],[86,92,'A'],[93,99,'C'],[100,104,'D'],[105,109,'K'],[110,116,'L'],[117,120,'H']],
   blocos:[[1,55,'Bloco I',15],[56,85,'Bloco II',10],[86,120,'Bloco III',10]],min:50,
   pdfs:[['Caderno · itens 9 a 120','PRF_21/arquivos/578_PRF_001_01.PDF'],['Língua inglesa · itens 1 a 8','PRF_21/arquivos/578_PRF_ING_01.PDF'],['Gabarito definitivo','PRF_21/arquivos/GAB_DEFINITIVO_578_PRF_001_01.PDF'],['Prova discursiva','PRF_21/arquivos/PRF_21_PROVA_DISCURSIVA.PDF'],['Padrão de resposta da discursiva','PRF_21/arquivos/PRF_21_PADRAO_DE_RESPOSTA_DEFINITIVO.PDF']],

{id:'t6',a:'T',t:'Crimes de trânsito',q:`Para que o condutor responda pelo crime de embriaguez ao volante, é ⟦indispensável⟧ o teste do etilômetro ou o exame de sangue.`,g:'E',

{id:'t7',a:'T',t:'Pontuação',q:`Tem o direito de dirigir suspenso o condutor que somar 30 pontos em 12 meses, ⟦se entre as infrações houver uma gravíssima⟧.`,g:'C',

{id:'t8',a:'T',t:'Transporte de crianças',q:`Criança com menos de 10 anos que ainda não atingiu 1,45 m de altura pode viajar ⟦no banco dianteiro⟧, desde que use dispositivo de retenção adequado.`,g:'E',

{id:'t9',a:'T',t:'Sistema Nacional de Trânsito',q:`A PRF é o órgão executivo rodoviário da União ⟦responsável pela construção e pela manutenção⟧ das rodovias federais.`,g:'E',

 pi:`Construir e manter rodovias é do DNIT, não da PRF.`,d:`Competências da PRF caem em toda prova. Guarde: PRF patrulha e fiscaliza; DNIT constrói e mantém; CONTRAN normatiza.`},

{id:'t11',a:'T',t:'Faróis',q:`Em rodovia de pista simples fora do perímetro urbano, veículo sem luz de rodagem diurna deve trafegar de dia ⟦com o farol baixo aceso⟧.`,g:'C',

 pi:`Pista simples + fora do perímetro urbano + sem DRL.`,d:`A lei de 2020 mudou várias regras do CTB. Itens sobre farol, cadeirinha, pontuação e validade da CNH vêm dessa mudança.`},
{id:'t12',a:'T',t:'Habilitação',q:`O exame de aptidão física e mental de condutor com ⟦65 anos⟧ é renovado a cada 10 anos.`,g:'E',

{id:'t13',a:'T',t:'Habilitação',q:`O condutor com Permissão para Dirigir recebe a CNH ao fim de ⟦um ano⟧, desde que não tenha cometido infração grave ou gravíssima nem seja reincidente em infração média.`,g:'C',

{id:'t14',a:'T',t:'Estacionamento',q:`Estacionar no acostamento de rodovia é permitido ⟦sempre que o condutor ligar o pisca-alerta⟧.`,g:'E',

{id:'t15',a:'T',t:'Velocidades',q:`Transitar em velocidade ⟦mais de 50% acima⟧ da máxima permitida é infração gravíssima, com multa multiplicada por três e suspensão do direito de dirigir.`,g:'C',

{id:'p1',a:'P',t:'Reescrita',x:TX_ESTRADA,q:`A expressão "Por isso", no último período, poderia ser substituída por ⟦Portanto⟧, sem prejuízo da correção gramatical e dos sentidos do texto.`,g:'C',
 p:`"Por isso" introduz uma conclusão do que foi dito antes, assim como "Portanto". A troca mantém sentido e correção.`,
 pi:`As duas expressões indicam conclusão.`,d:`Em itens de reescrita, confira duas coisas separadas: a gramática e o sentido. As duas precisam se manter.`},
{id:'p2',a:'P',t:'Conectivos',x:TX_ESTRADA,q:`O trecho "ainda que o destino pareça próximo" expressa ideia de ⟦causa⟧.`,g:'E',
 p:`"Ainda que" introduz concessão: mesmo que o destino esteja perto, deve-se parar. Causa seria "porque", "já que".`,
 pi:`"Ainda que" = "mesmo que" (concessão).`,d:`Teste trocando o conectivo: se "mesmo que" funciona, é concessão; se "porque" funciona, é causa.`},
{id:'p3',a:'P',t:'Interpretação',x:TX_ESTRADA,q:`Infere-se do texto que o cansaço ao volante é perigoso porque ⟦avisa o motorista com antecedência⟧, levando-o a reduzir a velocidade.`,g:'E',
 p:`O texto diz o contrário: o cansaço "chega sem aviso". O item inverte a informação.`,
 pi:`"Chega sem aviso" × "avisa com antecedência".`,d:`Muitos itens de interpretação são Errados porque invertem ou extrapolam o texto. Ache o trecho exato antes de julgar.`},
{id:'p4',a:'P',t:'Linguagem figurada',x:TX_ESTRADA,q:`No trecho "o motorista deixa de estar ali", o autor emprega ⟦linguagem figurada⟧ para indicar a perda momentânea de atenção.`,g:'C',
 p:`O motorista continua fisicamente no carro; "deixa de estar ali" é figurado: ele apaga por alguns segundos.`,
 pi:`Ninguém sai do carro: o sentido não é literal.`,d:`Pergunte: isso aconteceu de verdade, ao pé da letra? Se não, é linguagem figurada.`},
{id:'p5',a:'P',t:'Crase',q:`Na frase "Os agentes chegaram ⟦à⟧ rodovia logo cedo", o emprego do acento indicativo de crase é obrigatório.`,g:'C',
 p:`"Chegar" pede a preposição "a", e "rodovia" aceita o artigo "a": a + a = à.`,
 pi:`Verbo que pede "a" + palavra feminina com artigo.`,d:`Teste com masculino: "chegaram ao posto". Se aparece "ao", no feminino há crase.`},
{id:'p6',a:'P',t:'Redação oficial',q:`Nas comunicações oficiais, o fecho ⟦"Respeitosamente"⟧ é usado para autoridades de hierarquia superior, e "Atenciosamente", para as de mesma hierarquia ou inferior.`,g:'C',
 p:`É a regra do Manual de Redação da Presidência da República para os fechos das comunicações.`,
 pi:`Superior = "Respeitosamente"; mesma ou inferior = "Atenciosamente".`,d:`Redação oficial teve 5 itens em 2021. Estude o Manual de Redação: características, vocativo, fechos e e-mail.`},
{id:'p7',a:'P',t:'Redação oficial',q:`A linguagem das comunicações oficiais admite ⟦gírias e regionalismos⟧, desde que facilitem a compreensão do destinatário.`,g:'E',
 p:`A redação oficial exige formalidade, impessoalidade, clareza e norma-padrão. Gírias e regionalismos não cabem.`,
 pi:`Gíria contraria a formalidade exigida.`,d:`Características da redação oficial: clareza, precisão, objetividade, concisão, coesão, impessoalidade, formalidade e uso da norma-padrão.`},

{id:'r1',a:'R',t:'Negação',q:`A negação da proposição "Todo motorista respeita o limite de velocidade" é ⟦"Nenhum motorista respeita o limite de velocidade"⟧.`,g:'E',
 p:`Para derrubar "todo", basta um contraexemplo. A negação é "Algum motorista não respeita o limite de velocidade".`,
 pi:`"Nenhum" é o oposto extremo, não a negação.`,d:`Negação de "todo A é B" = "algum A não é B". Negação de "nenhum A é B" = "algum A é B".`},
{id:'r2',a:'R',t:'Equivalência',q:`A proposição "Se o condutor bebeu, então não dirige" é equivalente a ⟦"Se o condutor dirige, então não bebeu"⟧.`,g:'C',
 p:`"Se p, então não q" equivale à contrapositiva "se q, então não p". Aqui p = bebeu, q = dirige.`,
 pi:`Inverte e nega: contrapositiva.`,d:`p → q equivale a ~q → ~p. A troca simples (q → p) NÃO é equivalente.`},
{id:'r3',a:'R',t:'Porcentagem',q:`Uma operação fiscalizou 400 veículos e encontrou irregularidade em 15% deles. Assim, ⟦60 veículos⟧ estavam irregulares.`,g:'C',
 p:`15% de 400 = 0,15 × 400 = 60.`,pi:`10% de 400 = 40; 5% = 20; somando, 60.`,d:`Sem calculadora: quebre a porcentagem em 10% e 5%.`},
{id:'r4',a:'R',t:'Contagem',q:`Com as letras A, B e C, sem repetição, é possível formar ⟦9⟧ sequências diferentes de três letras.`,g:'E',
 p:`São 3 × 2 × 1 = 6 sequências (ABC, ACB, BAC, BCA, CAB, CBA). 9 seria com repetição de só duas posições, o que não é o caso.`,
 pi:`Sem repetição: 3 × 2 × 1.`,d:`Princípio multiplicativo: escolha a primeira posição, depois a segunda com o que sobrou, e assim por diante.`},
{id:'r5',a:'R',t:'Probabilidade',q:`A probabilidade de um carro sorteado estar com documentação irregular é 0,2. Sorteando-se dois carros, de forma independente, a probabilidade de ambos estarem irregulares é ⟦0,04⟧.`,g:'C',
 p:`Eventos independentes: multiplica-se. 0,2 × 0,2 = 0,04.`,pi:`"Ambos" + "independente" = multiplicação.`,d:`"E" (os dois acontecem) multiplica; "ou" (um ou outro, sem sobreposição) soma.`},

{id:'n1',a:'N',t:'Segurança',q:`Ransomware é um tipo de código malicioso que ⟦criptografa os dados⟧ da vítima e exige pagamento de resgate para liberá-los.`,g:'C',
 p:`Essa é a definição de ransomware: sequestra os dados por criptografia e cobra resgate.`,pi:`"Criptografa" + "resgate".`,d:`Ransomware caiu em 2021. Liste os tipos de malware com uma palavra-chave cada: worm (se espalha sozinho), spyware (espiona), ransomware (sequestra).`},
{id:'n2',a:'N',t:'Navegação',q:`A navegação em modo anônimo ⟦impede que o provedor de internet⟧ identifique os sites visitados pelo usuário.`,g:'E',
 p:`O modo anônimo só não guarda histórico, cookies e dados de formulário no próprio computador. Provedor, rede da empresa e os sites continuam vendo o acesso.`,
 pi:`O modo anônimo protege só o computador local.`,d:`Na dúvida sobre "privacidade", pergunte: protege de quem? Modo anônimo protege de quem usa o mesmo computador.`},
{id:'n3',a:'N',t:'Segurança',q:`O cadeado e o HTTPS na barra de endereços ⟦garantem que o site é legítimo⟧ e pertence à empresa que ele diz representar.`,g:'E',
 p:`HTTPS garante conexão criptografada. Sites de phishing também podem ter cadeado; ele não prova que o site é de quem diz ser.`,
 pi:`Criptografia não é garantia de legitimidade.`,d:`Itens que prometem "garantia" total em segurança costumam ser Errados.`},
{id:'n4',a:'N',t:'Nuvem',q:`No modelo SaaS de computação em nuvem, o usuário acessa ⟦um software pronto⟧ pela internet, sem gerenciar a infraestrutura.`,g:'C',
 p:`SaaS = software como serviço (como um e-mail na web). PaaS oferece plataforma para desenvolver; IaaS oferece infraestrutura (servidores, rede).`,
 pi:`"Software pronto" = SaaS.`,d:`SaaS caiu em 2021. Guarde a escada: IaaS (infraestrutura) → PaaS (plataforma) → SaaS (software pronto).`},
{id:'n5',a:'N',t:'Malware',q:`Diferentemente do vírus, o worm ⟦precisa de um programa hospedeiro⟧ para se propagar.`,g:'E',
 p:`É o contrário: o worm se propaga sozinho pela rede; o vírus precisa se anexar a um arquivo ou programa hospedeiro.`,
 pi:`A característica foi trocada entre worm e vírus.`,d:`A banca adora trocar características entre conceitos parecidos. Estude em pares: vírus × worm.`},

{id:'f1',a:'F',t:'Lançamento oblíquo',q:`Em um lançamento oblíquo, desprezada a resistência do ar, a ⟦velocidade⟧ do projétil no ponto mais alto da trajetória é nula.`,g:'E',
 p:`No ponto mais alto, só a componente vertical da velocidade é zero. A componente horizontal continua igual durante todo o movimento.`,
 pi:`"Velocidade" inteira × só a componente vertical.`,d:`Lançamento de projétil caiu em 2019 e em 2021. Sempre separe o movimento em horizontal (uniforme) e vertical (acelerado por g).`},
{id:'f2',a:'F',t:'Lançamento oblíquo',q:`Em um lançamento oblíquo, desprezada a resistência do ar, a aceleração do projétil é ⟦constante⟧ durante todo o movimento.`,g:'C',
 p:`A única força é o peso, então a aceleração é sempre g, vertical para baixo, inclusive no ponto mais alto.`,
 pi:`Sem resistência do ar, só a gravidade atua.`,d:`No topo da trajetória, a força resultante continua sendo o peso, e não zero.`},
{id:'f3',a:'F',t:'Energia',q:`Se a velocidade de um veículo ⟦dobra⟧, sua energia cinética também dobra.`,g:'E',
 p:`Energia cinética = m·v²/2. Dobrando v, a energia fica 4 vezes maior. Por isso a distância de frenagem cresce muito com a velocidade.`,
 pi:`A velocidade está ao quadrado.`,d:`Bom argumento para a discursiva: a 2× a velocidade, o carro precisa dissipar 4× a energia para parar.`},
{id:'f4',a:'F',t:'Curvas',q:`Em uma curva plana, a força que mantém o carro na trajetória circular é o ⟦atrito⟧ entre os pneus e a pista, que atua como resultante centrípeta.`,g:'C',
 p:`Em curva plana, sem inclinação, o atrito lateral faz o papel de força centrípeta. Com pista molhada, o atrito cai e o carro tende a sair pela tangente.`,
 pi:`Curva plana: a força para o centro vem do atrito.`,d:`Aceleração centrípeta = v²/r. Curvas fechadas (r pequeno) em velocidade alta exigem muito atrito.`},

{id:'e1',a:'E',t:'Código de Ética',q:`Segundo o Código de Ética do servidor público civil do Poder Executivo federal, a pena aplicável pela Comissão de Ética é a de ⟦censura⟧.`,g:'C',
 p:`Decreto 1.171/1994: a única pena que a Comissão de Ética aplica é a censura.`,pi:`Comissão de Ética = censura.`,d:`Não confunda com as penalidades da Lei 8.112 (advertência, suspensão, demissão), aplicadas em processo disciplinar.`},
{id:'e2',a:'E',t:'Código de Ética',q:`Por se tratar de vida privada, a conduta do servidor ⟦fora do serviço⟧ não tem nenhuma relação com a ética no serviço público.`,g:'E',
 p:`O Código de Ética diz que a função pública se integra à vida particular do servidor: atos da vida privada podem aumentar ou diminuir seu bom conceito na vida funcional.`,
 pi:`"Nenhuma relação" contraria o Código.`,d:`Moralidade e conduta fora do serviço caíram em 2019. Afirmações absolutas como "nenhuma relação" merecem desconfiança.`},

{id:'g1',a:'G',t:'Rodovias federais',q:`Pela nomenclatura das rodovias federais, a BR-116, cujo primeiro algarismo é 1, é uma rodovia ⟦longitudinal⟧, de direção predominante norte-sul.`,g:'C',
 p:`Primeiro algarismo: 0 = radial (sai de Brasília), 1 = longitudinal (norte-sul), 2 = transversal (leste-oeste), 3 = diagonal, 4 = ligação.`,
 pi:`O algarismo 1 indica longitudinal.`,d:`Decore 0-1-2-3-4: radial, longitudinal, transversal, diagonal, ligação.`},
{id:'g2',a:'G',t:'Rodovias federais',q:`As rodovias federais radiais partem de Brasília e têm numeração iniciada pelo algarismo ⟦2⟧.`,g:'E',
 p:`Radiais começam com 0 (por exemplo, BR-040). As que começam com 2 são transversais, de direção leste-oeste.`,
 pi:`Radiais = 0, não 2.`,d:`O item começa certo ("partem de Brasília") e erra no detalhe. Leia até o fim.`},
{id:'g3',a:'G',t:'Transportes',q:`O transporte de cargas no Brasil é ⟦concentrado no modal rodoviário⟧, o que torna a malha de rodovias estratégica para a economia.`,g:'C',
 p:`A maior parte das cargas no Brasil é transportada por rodovias, o que dá peso econômico e estratégico à malha rodoviária e à fiscalização.`,
 pi:`Concentração no rodoviário.`,d:`Geopolítica na PRF puxa para transporte e território: rodovias, cargas, integração regional e cidades.`},

{id:'i1',a:'I',t:'Interpretação',x:TX_EN,q:`According to the text, crashes ⟦decrease⟧ in areas where speed cameras are installed.`,g:'C',
 p:`"Crashes fall in areas where they are installed" = os acidentes diminuem onde os radares estão instalados.`,
 pi:`"Fall" = cair, diminuir.`,d:`Os itens de língua estrangeira vêm em inglês, mas medem leitura. Ache no texto o trecho exato que o item cita.`},
{id:'i2',a:'I',t:'Conectivos',x:TX_EN,q:`The word "However" introduces an idea that ⟦confirms⟧ the previous sentence.`,g:'E',
 p:`"However" = no entanto. A segunda frase contrasta com a primeira: os radares são impopulares, mas reduzem acidentes.`,
 pi:`"However" indica contraste, não confirmação.`,d:`Conectivos que mais caem: however, but, although (contraste); so, therefore (conclusão); because (causa).`},

{id:'a1',a:'A',t:'Atos administrativos',q:`Constatada a ilegalidade de um ato administrativo, a administração deve ⟦revogá-lo⟧, com efeitos a partir da revogação.`,g:'E',
 p:`Ato ilegal é anulado, com efeitos retroativos. Revogação é para ato válido que deixou de ser conveniente ou oportuno, com efeitos dali em diante (Súmula 473 do STF).`,
 pi:`Ilegal = anular, não revogar.`,d:`Par clássico da Cebraspe: anular (ilegalidade, efeito retroativo) × revogar (conveniência, efeito para frente).`},
{id:'a2',a:'A',t:'Poderes',q:`A multa de trânsito aplicada por policial rodoviário federal a um motorista é manifestação do ⟦poder de polícia⟧ da administração.`,g:'C',
 p:`Poder de polícia limita direitos individuais em favor do interesse público, como multar um condutor. Poder disciplinar é o que a administração exerce sobre seus próprios servidores.`,
 pi:`Multa a particular = poder de polícia.`,d:`Em 2021 a banca trocou poder de polícia por poder disciplinar num caso de multa. Pergunte: quem foi punido, um particular ou um servidor?`},
{id:'a3',a:'A',t:'Responsabilidade civil',q:`A responsabilidade civil do Estado por danos que seus agentes causarem a terceiros é, em regra, ⟦objetiva⟧, assegurado o direito de regresso contra o agente em caso de dolo ou culpa.`,g:'C',
 p:`Art. 37, § 6º, da Constituição: o Estado responde independentemente de culpa; depois pode cobrar do agente que agiu com dolo ou culpa.`,
 pi:`Estado: objetiva. Agente (no regresso): subjetiva.`,d:`Responsabilidade civil caiu em 2013 e 2019. Guarde as duas metades: objetiva para o Estado, subjetiva para o agente.`},
{id:'a4',a:'A',t:'Independência das instâncias',q:`A absolvição criminal do servidor ⟦por falta de provas⟧ impede, necessariamente, sua punição administrativa pelo mesmo fato.`,g:'E',
 p:`As instâncias são independentes. Só a absolvição que nega a existência do fato ou a autoria afasta a responsabilidade administrativa (Lei 8.112, art. 126).`,
 pi:`Falta de provas não é negativa de fato ou de autoria.`,d:`Item parecido caiu em 2013. As exceções que comunicam as instâncias são só duas: inexistência do fato e negativa de autoria.`},

{id:'c1',a:'C',t:'Art. 144',q:`A polícia rodoviária federal é ⟦órgão permanente⟧, organizado e mantido pela União e estruturado em carreira, destinado ao patrulhamento ostensivo das rodovias federais.`,g:'C',
 p:`É o texto do art. 144, § 2º, da Constituição.`,pi:`Todas as características do § 2º estão corretas.`,d:`O art. 144 cai em toda prova da PRF. Leia o § 2º até saber de cor.`},
{id:'c2',a:'C',t:'Direitos fundamentais',q:`O direito de reunião pacífica, sem armas, em locais abertos ao público ⟦depende de autorização⟧ da autoridade competente.`,g:'E',
 p:`Art. 5º, XVI: a reunião independe de autorização; exige-se apenas aviso prévio à autoridade.`,pi:`Aviso prévio não é autorização.`,d:`Direito de reunião caiu em 2021. Diferencie: avisar (exigido) × pedir autorização (não exigido).`},
{id:'c3',a:'C',t:'Inviolabilidade do domicílio',q:`A casa é asilo inviolável, mas nela se pode entrar sem consentimento do morador ⟦em caso de flagrante delito, a qualquer hora⟧.`,g:'C',
 p:`Art. 5º, XI: sem consentimento, só em flagrante, desastre ou para prestar socorro (a qualquer hora) ou por ordem judicial (durante o dia).`,
 pi:`Flagrante não tem restrição de horário; ordem judicial sim.`,d:`A banca troca os horários: ordem judicial só de dia; flagrante, desastre e socorro a qualquer hora.`},
{id:'c4',a:'C',t:'Remédios constitucionais',q:`O ⟦habeas data⟧ é o remédio constitucional adequado para proteger a liberdade de locomoção.`,g:'E',
 p:`Liberdade de locomoção é protegida por habeas corpus. Habeas data serve para conhecer ou corrigir informações pessoais em bancos de dados públicos.`,
 pi:`Locomoção = habeas corpus.`,d:`Remédios: habeas corpus (locomoção), habeas data (informações pessoais), mandado de segurança (direito líquido e certo nos demais casos).`},

{id:'d1',a:'D',t:'Crimes contra a administração',q:`O motorista que ⟦oferece dinheiro⟧ a policial rodoviário federal para não ser autuado comete corrupção ativa, ainda que o policial recuse a oferta.`,g:'C',
 p:`Corrupção ativa (art. 333 do Código Penal) é crime formal: consuma-se com a oferta, mesmo que o policial recuse.`,
 pi:`Oferecer basta; a aceitação não é necessária.`,d:`Caiu em 2021 numa abordagem. Crime formal se consuma com a conduta, sem precisar do resultado.`},
{id:'d2',a:'D',t:'Crimes contra a administração',q:`O policial que ⟦exige⟧ vantagem indevida em razão da função comete o crime de corrupção passiva.`,g:'E',
 p:`Exigir é concussão (art. 316). Corrupção passiva (art. 317) é solicitar, receber ou aceitar promessa de vantagem.`,
 pi:`O verbo "exigir" define a concussão.`,d:`Decore os verbos: exigir = concussão; solicitar/receber = corrupção passiva; oferecer/prometer = corrupção ativa.`},
{id:'d3',a:'D',t:'Excludentes',q:`Age em ⟦legítima defesa⟧ quem, usando moderadamente dos meios necessários, repele injusta agressão, atual ou iminente, a direito seu ou de outrem.`,g:'C',
 p:`É a definição do art. 25 do Código Penal.`,pi:`Agressão injusta, atual ou iminente, repelida com moderação.`,d:`Estado de necessidade (art. 24) é perigo atual que não foi provocado; legítima defesa é agressão injusta. Não confunda.`},

{id:'k1',a:'K',t:'Flagrante',q:`As autoridades policiais e seus agentes ⟦deverão⟧ prender quem quer que seja encontrado em flagrante delito, e qualquer do povo ⟦poderá⟧ fazê-lo.`,g:'C',
 p:`Art. 301 do CPP: flagrante obrigatório para a polícia, facultativo para qualquer pessoa.`,pi:`"Deverão" (polícia) × "poderá" (povo).`,d:`A banca troca os verbos: se disser que o policial "pode" prender em flagrante, desconfie.`},
{id:'k2',a:'K',t:'Flagrante',q:`Considera-se em flagrante ⟦impróprio⟧ quem é encontrado, logo depois do crime, com instrumentos, armas ou objetos que façam presumir ser ele o autor.`,g:'E',
 p:`Esse é o flagrante presumido (art. 302, IV). Impróprio é quem é perseguido logo após o crime (art. 302, III).`,
 pi:`"Encontrado com objetos" = presumido; "perseguido" = impróprio.`,d:`Espécies de flagrante: próprio (cometendo ou acabou de cometer), impróprio (perseguido), presumido (encontrado com objetos).`},
{id:'k3',a:'K',t:'Busca pessoal',q:`A busca pessoal ⟦depende sempre de mandado judicial⟧.`,g:'E',
 p:`Art. 244 do CPP: a busca pessoal independe de mandado em caso de prisão, de fundada suspeita ou durante busca domiciliar.`,
 pi:`"Sempre": a lei prevê exceções.`,d:`Busca em veículo caiu em 2021. "Sempre" e "somente" em itens de processo penal costumam ser armadilha.`},

{id:'l1',a:'L',t:'Estatuto do Desarmamento',q:`Manter arma de fogo de uso permitido, sem registro, ⟦no interior da própria residência⟧ caracteriza posse irregular, e não porte ilegal.`,g:'C',
 p:`Lei 10.826/2003: dentro de casa ou no local de trabalho (sendo o responsável) é posse irregular (art. 12). Fora disso, é porte ilegal (art. 14).`,
 pi:`Dentro de casa = posse.`,d:`Posse × porte: posse é guardar em casa ou no trabalho; porte é levar consigo.`},
{id:'l2',a:'L',t:'Tortura',q:`O crime de tortura previsto na Lei 9.455/1997 ⟦só pode ser praticado por agente público⟧.`,g:'E',
 p:`A tortura é crime comum: qualquer pessoa pode praticar. Ser agente público é causa de aumento de pena.`,
 pi:`"Só": qualquer pessoa pode ser autora.`,d:`Tortura caiu em 2021 numa situação com policiais. Lembre: crime comum, com pena maior para agente público.`},
{id:'l3',a:'L',t:'Abuso de autoridade',q:`Para configurar abuso de autoridade (Lei 13.869/2019), a conduta deve ser praticada com ⟦finalidade específica⟧ de prejudicar outrem ou beneficiar a si ou a terceiro, ou por mero capricho ou satisfação pessoal.`,g:'C',
 p:`Art. 1º, § 1º, da Lei 13.869/2019 exige essa finalidade específica (dolo específico).`,
 pi:`Sem finalidade específica, não há crime de abuso de autoridade.`,d:`Abuso de autoridade caiu em 2021. Guarde também: divergência de interpretação da lei não configura o crime.`},
{id:'l4',a:'L',t:'Abuso de autoridade',q:`Segundo a Lei 13.869/2019, a ⟦divergência na interpretação da lei⟧ ou na avaliação de fatos e provas, por si só, configura abuso de autoridade.`,g:'E',
 p:`Art. 1º, § 2º: a divergência na interpretação da lei ou na avaliação de fatos e provas não configura abuso de autoridade.`,
 pi:`A lei diz expressamente o contrário.`,d:`Quando o item cita "por si só", confira se a lei não exclui exatamente aquela hipótese.`},

{id:'h1',a:'H',t:'Tratados',q:`Tratados internacionais de direitos humanos aprovados em cada Casa do Congresso, em dois turnos, por ⟦três quintos⟧ dos votos dos respectivos membros, equivalem a emendas constitucionais.`,g:'C',
 p:`Art. 5º, § 3º, da Constituição. Os demais tratados de direitos humanos têm status supralegal (acima das leis, abaixo da Constituição).`,
 pi:`Quórum de emenda: 3/5, dois turnos, nas duas Casas.`,d:`Status dos tratados caiu em 2019. A Convenção sobre os Direitos das Pessoas com Deficiência foi aprovada com esse rito.`},
{id:'h2',a:'H',t:'DUDH',q:`A Declaração Universal dos Direitos Humanos, de 1948, foi adotada como ⟦tratado internacional⟧ de cumprimento obrigatório, ratificado pelo Brasil.`,g:'E',
 p:`A DUDH é uma resolução da Assembleia Geral da ONU, não um tratado ratificado. Sua força vem do reconhecimento como referência universal.`,
 pi:`Declaração não é tratado.`,d:`DUDH caiu em 2021. Ela inaugurou o sistema global de proteção, mas como declaração.`},
{id:'h3',a:'H',t:'Características',q:`Os direitos humanos são ⟦indivisíveis⟧ e interdependentes: não se pode garantir alguns e negar outros.`,g:'C',
 p:`Universalidade, indivisibilidade, interdependência e inalienabilidade são características reconhecidas dos direitos humanos.`,
 pi:`Indivisibilidade: os direitos formam um conjunto.`,d:`Item de 2019 dizia que os direitos humanos surgiram todos de uma vez; era Errado. Eles foram reconhecidos ao longo da história (as "gerações").`}
];
const QM = Object.fromEntries(Q.map(q => [q.id, q]));

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const app = $('#app'), nav = $('#nav');
const pad = n => String(n).padStart(2, '0');
function key(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseKey(k){ const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(k, n){ const d = parseKey(k); d.setDate(d.getDate() + n); return key(d); }
function diffDays(a, b){ return Math.round((parseKey(b) - parseKey(a)) / 864e5); }
const today = () => key(new Date());
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hl(s, rev){ return esc(s).replace(/⟦(.+?)⟧/g, rev ? '<mark>$1</mark>' : '$1'); }
const fmtD = k => { const d = parseKey(k); return d.getDate() + '/' + (d.getMonth() + 1); };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const NOME_G = {C:'CERTO', E:'ERRADO'};

/* ---------- progresso salvo neste aparelho ---------- */
const KEY = 'prf30-v1';
const fresh = () => ({v:1, start:today(), exam:'', days:{}, qs:{}, ar:{}, red:{}, pr:{}, sims:[]});
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return Object.assign(fresh(), s); } catch (e) {} return fresh(); }
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function studied(k){
  const d = S.days[k], r = S.red[k];
  return !!((d && ((d.q || 0) + (d.pr || 0)) >= 6) || (r && r.length === 3 && r.every(Boolean)));
}
function streak(){ let k = today(); if (!studied(k)) k = addDays(k, -1); let n = 0; while (studied(k)){ n++; k = addDays(k, -1); } return n; }
function bumpDay(kind, ok, n){
  const t = today(), d = S.days[t] || {q:0, ok:0, pr:0, prok:0};
  if (kind === 'q'){ d.q = (d.q || 0) + n; d.ok = (d.ok || 0) + ok; }
  else { d.pr = (d.pr || 0) + n; d.prok = (d.prok || 0) + ok; }
  S.days[t] = d;
}
function record(q, ok){
  const t = today(), r = S.qs[q.id] || {n:0, ok:0, step:0};
  r.n++; if (ok) r.ok++; r.last = t; r.lastOk = ok;
  if (!ok){ r.due = addDays(t, 1); r.step = 0; }
  else if (r.due){ if (r.step >= 1) r.due = null; else { r.due = addDays(t, 3); r.step = 1; } }
  S.qs[q.id] = r;
  const a = S.ar[q.a] || {n:0, ok:0}; a.n++; if (ok) a.ok++; S.ar[q.a] = a;
}

/* ---------- provas oficiais ---------- */
const edById = id => EDS.find(e => e.id === id);
function prState(id){ return S.pr[id] || (S.pr[id] = {a:{}, c:{}}); }
// Regra do Cebraspe: +1 concordante, −1 discordante, 0 em branco; item anulado vale +1 para todos.
function pts(e, q, a){ const k = e.k[q - 1]; if (k === 'X') return 1; if (!a) return 0; return a === k ? 1 : -1; }
function prStats(id){
  const e = edById(id), st = S.pr[id]; let n = 0, net = 0, c = 0, w = 0;
  if (st) for (const q in st.c){ n++; const p = pts(e, +q, st.a[q]); net += p; if (p > 0) c++; else if (p < 0) w++; }
  return {n, net, c, w};
}

let tab = 'hoje', sess = null, sim = null, provaSel = null, resetArm = false;

function pickDaily(areas, n, rev){
  const t = today(), pick = [];
  const add = list => { for (const q of list){ if (pick.length >= n) break; if (!pick.includes(q.id)) pick.push(q.id); } };
  add(shuffle(Q.filter(q => { const r = S.qs[q.id]; return r && r.due && r.due <= t; })).slice(0, rev ? n : 4));
  const seen = Q.filter(q => S.qs[q.id]).sort((x, y) => {
    const a = S.qs[x.id], b = S.qs[y.id];
    if (a.lastOk !== b.lastOk) return a.lastOk ? 1 : -1;
    const fa = areas.includes(x.a) ? 0 : 1, fb = areas.includes(y.a) ? 0 : 1;
    if (fa !== fb) return fa - fb;
    return a.last < b.last ? -1 : a.last > b.last ? 1 : 0;
  });
  const novosFoco = shuffle(Q.filter(q => !S.qs[q.id] && areas.includes(q.a)));
  const novos = shuffle(Q.filter(q => !S.qs[q.id]));
  (rev ? [seen, novos] : [novosFoco, novos, seen]).forEach(add);
  return shuffle(pick);
}
function startDaily(n, areas, rev){
  const t = today(), ids = pickDaily(areas, n, rev);
  sess = {ids, i:0, res:[], chosen:null, revealed:false, t0:Date.now(), end:false,
    tags: ids.map(id => { const r = S.qs[id]; return r && r.due && r.due <= t ? 'REVISÃO' : r ? 'REPETIDO' : ''; })};
  render(); scrollTo(0, 0);
}
// Simulado com o peso dos blocos de 2021: bloco I 46%, bloco II (trânsito) 25%, bloco III 29%.
function pickSim(n){
  const nT = Math.round(n * .25), n3 = Math.round(n * .29), n1 = n - nT - n3;
  const grupo = b => shuffle(Q.filter(q => BLOCO_DE[q.a] === b));
  let ids = [...grupo(1).slice(0, n1), ...grupo(2).slice(0, nT), ...grupo(3).slice(0, n3)].map(q => q.id);
  if (ids.length < n) ids = ids.concat(shuffle(Q.filter(q => !ids.includes(q.id))).slice(0, n - ids.length).map(q => q.id));
  return ids.sort((x, y) => BLOCO_DE[QM[x].a] - BLOCO_DE[QM[y].a] || ORDEM.indexOf(QM[x].a) - ORDEM.indexOf(QM[y].a));
}
function startSim(n){
  sim = {ids:pickSim(n), i:0, ans:{}, chute:{}, t0:Date.now(), end:false};
  render(); scrollTo(0, 0);
}
function finishSim(){
  let c = 0, w = 0, b = 0, cc = 0, cw = 0;
  sim.ids.forEach(id => {
    const q = QM[id], a = sim.ans[id];
    if (!a){ b++; record(q, false); return; }
    const ok = a === q.g; if (ok) c++; else w++;
    if (sim.chute[id]){ if (ok) cc++; else cw++; }
    record(q, ok);
  });
  bumpDay('q', c, sim.ids.length);
  sim.end = true;
  sim.result = {c, w, b, cc, cw, net:c - w, n:sim.ids.length, min:Math.max(1, Math.round((Date.now() - sim.t0) / 60000))};
  S.sims.unshift({date:today(), ...sim.result});
  S.sims = S.sims.slice(0, 40);
  save();
}

function calendario(){
  const t = today(), off = (parseKey(t).getDay() + 6) % 7;
  let k = addDays(t, -off - 21);
  const end = addDays(t, 6 - off + 7);
  let cells = '';
  while (k <= end){
    const d = parseKey(k); let cls = 'd';
    if (studied(k)) cls += ' done';
    if (k > t) cls += ' future';
    if (k === t) cls += ' today';
    if (S.exam && k === S.exam) cls += ' exam';
    const m = d.getDate() === 1 || k === addDays(t, -off - 21) ? ` data-m="${MES[d.getMonth()]}"` : '';
    cells += `<span class="${cls}"${m} title="${fmtD(k)}">${d.getDate()}</span>`;
    k = addDays(k, 1);
  }
  return `<section class="card"><div class="cal-head"><h2 class="h-sm">Suas últimas semanas</h2>
    <p class="legend"><span><span class="lg done"></span>estudou</span><span><span class="lg today"></span>hoje</span>${S.exam ? '<span><span class="lg exam"></span>prova</span>' : ''}</p></div>

}

function viewEdicao(){
  const e = edById(provaSel.id), st = prState(e.id), {from, to} = provaSel;
  const blocks = []; for (let f = 1; f <= 120; f += 20) blocks.push([f, f + 19]); blocks.push([1, 120]);
  const chips = blocks.map(([f, t]) => {
    const on = f === from && t === to, label = f === 1 && t === 120 ? 'Inteira' : `${f}–${t}`;
    let done = true; for (let q = f; q <= t; q++) if (!st.c[q]){ done = false; break; }
    return `<button class="chip-btn${on ? ' on' : ''}${done ? ' done' : ''}" data-act="blk" data-f="${f}" data-t="${t}" aria-pressed="${on}">${label}${done ? ' ✓' : ''}</button>`;
  }).join('');
  let rows = '', marked = false, corr = 0, net = 0, c = 0, w = 0;
  for (let q = from; q <= to; q++){
    const k = e.k[q - 1], sc = e.s[q - 1], a = st.a[q], done = !!st.c[q];
    if (a && !done) marked = true;
    let p = 0;
    if (done){ corr++; p = pts(e, q, a); net += p; if (p > 0) c++; else if (p < 0) w++; }
    const bubs = ['C', 'E'].map(l => {
      let cls = 'bub-btn';
      if (done){ if (k !== 'X' && l === k) cls += ' right'; else if (l === a) cls += k === 'X' ? ' sel' : ' wrong'; }
      else if (l === a) cls += ' sel';
      return `<button class="${cls}" data-act="mark" data-q="${q}" data-l="${l}" aria-label="Item ${q}, ${l === 'C' ? 'certo' : 'errado'}" aria-pressed="${l === a}" ${done ? 'disabled' : ''}>${l}</button>`;
    }).join('');
    const note = done && k === 'X' ? '<span class="anul">anulado +1</span>' : done && !a ? '<span class="anul">em branco 0</span>' : '';
    rows += `<li class="crow${done ? (p > 0 ? ' is-ok' : p < 0 ? ' is-bad' : '') : ''}"><span class="qn">${pad(q)}</span><span class="qs">${ABR[sc] || ''}</span><span class="bubs">${bubs}</span>${note}</li>`;
  }
  const total = prStats(e.id);
  const blocosHtml = e.blocos.map(([a, b, nome, min]) => {
    let n = 0, s = 0; for (let q = a; q <= b; q++) if (st.c[q]){ n++; s += pts(e, q, st.a[q]); }
    const full = n === b - a + 1;
    const cls = min != null && full ? (s >= min ? ' okc' : ' badc') : '';
    return `<div class="blk"><span>${nome} <small>· itens ${a}–${b}${min != null ? ` · mínimo ${min}` : ''}</small></span><span class="num${cls}">${n ? `${s} (${n} corrigidos)` : '—'}</span></div>`;
  }).join('');
  const res = corr ? `<section class="card" id="res">
      <p class="eyebrow">Resultado · itens ${from} a ${to}</p>
      <p class="big-score">${net} <span>pontos · ${c} certos, ${w} errados, ${corr - c - w} em branco</span></p>
      <div class="blocks">${blocosHtml}<div class="blk"><span><b>Total corrigido</b>${e.min ? ` <small>· mínimo ${e.min} na prova inteira</small>` : ''}</span><span class="num${e.min && total.n === 120 ? (total.net >= e.min ? ' okc' : ' badc') : ''}">${total.net}</span></div></div>
      ${e.min ? '' : '<p class="meta">Os mínimos por bloco de 2021 eram 15, 10 e 10 pontos, e 50 no total.</p>'}
      <button class="link" data-act="refazer">Refazer estes itens</button></section>` : '';
  return `<button class="link" data-act="ed-back">← Simulados</button>
    <header class="hero"><p class="eyebrow">Prova oficial · ${e.nome}${e.data ? ' · ' + e.data : ''}</p>
      <h1 class="h1-sm">Cartão-resposta</h1><p class="sub">Discursiva desta prova: ${esc(e.disc)}.</p></header>
    <div class="links">${e.pdfs.map(([t, u], i) => i === 0 ? `<a class="ghost" href="${CDN + u}" target="_blank" rel="noopener">${t} (PDF) ↗</a>` : `<a class="link" href="${CDN + u}" target="_blank" rel="noopener">${t} (PDF) ↗</a>`).join('')}</div>
    <div class="chips" role="group" aria-label="Escolha os itens">${chips}</div>
    ${res}
    <section class="card">
      <div class="cartao-head"><p class="eyebrow">Itens ${from} a ${to}</p><span class="timer" data-t0="${provaSel.t0}" data-dur="${(to - from + 1) * SEG_ITEM}"></span></div>
      <ol class="crows">${rows}</ol>
      ${corr === to - from + 1 ? '' : `<button class="primary" id="corrigir" data-act="corrigir" ${marked ? '' : 'disabled'}>${corr ? 'Corrigir o que falta' : 'Corrigir'}</button>`}
      <p class="meta">Toque de novo numa bolinha para desmarcar e deixar em branco. Na correção: +1 certo, −1 errado, 0 em branco, anulado vale +1.</p>
    </section>`;
}

function viewPadroes(){
  const ed = EDS.map(e => { const cnt = {C:0, E:0, X:0}; for (const c of e.k) cnt[c]++; const run = Math.max(...(e.k.match(/C+|E+/g) || ['']).map(x => x.length)); return {e, cnt, run}; });
  const tot = ed.reduce((s, x) => ({C:s.C + x.cnt.C, E:s.E + x.cnt.E, X:s.X + x.cnt.X}), {C:0, E:0, X:0});
  const gabRows = ed.map(({e, cnt, run}) => `<tr><td>${e.nome}</td><td class="n">${cnt.C}</td><td class="n">${cnt.E}</td><td class="n">${cnt.X}</td><td class="n">${run}</td></tr>`).join('');
  const peso = ORDEM.map(c => `<tr><td>${MAT[c]}</td>${['2013', '2019', '2021'].map(id => `<td class="n">${[...edById(id).s].filter(x => x === c).length || '—'}</td>`).join('')}</tr>`).join('');
  const mats = PADROES.map(([c, itens]) => `<details class="mat"><summary><span>${MAT[c]}</span><small>${[...edById('2021').s].filter(x => x === c).length} em 2021</small></summary><ul>${itens.map(i => `<li>${esc(i)}</li>`).join('')}</ul></details>`).join('');
  return `<header class="hero"><p class="eyebrow">Padrões · 3 provas · 360 itens</p><h1 class="h1-sm">O que o Cebraspe repete na PRF</h1>
      <p class="sub">Analisei as provas de 2013, 2019 e 2021, com os gabaritos definitivos, as discursivas e o edital de 2021.</p></header>
    <section class="card"><p class="eyebrow">Como é a prova (modelo 2021)</p><h2 class="h-sm">120 itens de certo ou errado e uma discursiva</h2>
      <ul class="list"><li>Bloco I, 55 itens: Português 18, língua estrangeira 8, Informática 7, Raciocínio lógico 6, Física 6, Ética 5, Geopolítica 5.</li><li>Bloco II, 30 itens: Legislação de trânsito.</li><li>Bloco III, 35 itens: Direito Administrativo 7, Constitucional 7, Legislação especial 7, Penal 5, Processo Penal 5, Direitos Humanos 4.</li><li>Cada item certo vale +1, cada errado −1, em branco 0. Item anulado vale ponto para todos.</li><li>Mínimos para não ser eliminado: 15 no bloco I, 10 no II, 10 no III e 50 no total.</li><li>4h30 de prova. A discursiva vale 20 pontos, tem até 30 linhas e só é corrigida para quem passa na objetiva.</li><li>Depois vêm aptidão física, avaliações de saúde e psicológica, investigação social e curso de formação.</li></ul></section>
    <section class="card"><p class="eyebrow">Gabarito</p><h2 class="h-sm">Certo e Errado vêm equilibrados</h2>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Prova</th><th class="n">Certos</th><th class="n">Errados</th><th class="n">Anulados</th><th class="n">Maior sequência igual</th></tr></thead><tbody>${gabRows}</tbody></table></div>
      <p class="meta">Somando as 3 provas: ${tot.C} Certos, ${tot.E} Errados e ${tot.X} anulados. Não existe resposta "mais provável" para chutar, e sequências de 6 ou 7 iguais acontecem.</p></section>
    <section class="card"><p class="eyebrow">Palavras que pesam</p><h2 class="h-sm">O que as palavras do item indicam</h2>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Palavra no item</th><th class="n">Itens</th><th class="n">Errados</th></tr></thead><tbody>
        <tr><td>somente, apenas, exclusivamente</td><td class="n">16</td><td class="n">69%</td></tr>
        <tr><td>independentemente</td><td class="n">9</td><td class="n">78%</td></tr>
        <tr><td>vedado, proibido</td><td class="n">6</td><td class="n">67%</td></tr>
        <tr><td>necessariamente, obrigatoriamente</td><td class="n">4</td><td class="n">25%</td></tr></tbody></table></div>
      <p class="meta">Contei nos 317 itens válidos das 3 provas que consegui ler. Palavras restritivas puxam para Errado, mas um em cada três ainda é Certo. Use como alerta para ler com mais cuidado, nunca para decidir sozinho.</p></section>
    <section class="card"><p class="eyebrow">Peso das matérias</p><h2 class="h-sm">Trânsito virou o maior bloco</h2>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Matéria</th><th class="n">2013</th><th class="n">2019</th><th class="n">2021</th></tr></thead><tbody>${peso}</tbody></table></div>
      <p class="meta">Contagem aproximada por faixa de itens de cada caderno. Em 2013 o trânsito era quase ausente; em 2019 e 2021 virou um bloco inteiro.</p></section>
    <h2 class="h-sm">O que mais cai em cada matéria</h2>
    ${mats}
    <section class="card"><p class="eyebrow">Discursiva</p><h2 class="h-sm">Sempre sobre o trabalho da PRF</h2>
      <ul class="list"><li>2013: contrabando de mercadorias e cargas (definir o crime, mercadorias, problemas, medidas).</li><li>2019: o combate às infrações de trânsito nas rodovias federais (medidas da PRF, ações da sociedade, atitudes individuais).</li><li>2021: a inovação legislativa para reduzir acidentes de transporte terrestre (crimes de trânsito, Lei Seca, ações).</li><li>A banca dá os aspectos numerados, cada um com pontuação própria. Responda todos, na ordem, um parágrafo para cada.</li><li>Texto dissertativo de até 30 linhas; contam o conteúdo e o domínio da norma-padrão.</li></ul></section>
    <section class="card"><p class="eyebrow">Situação do concurso</p><h2 class="h-sm">Edital aguardado</h2>
      <p>Em 28/10/2026 ainda não havia edital nem data de prova. Os cursinhos esperam edital no fim de 2026 e prova no início de 2027. O último concurso foi do Cebraspe, cujo contrato foi prorrogado. Confira sempre no Diário Oficial e no site da PRF.</p></section>
    <p class="meta">Material de estudo independente, sem vínculo com a PRF ou o Cebraspe.</p>`;
}

function viewProgresso(){
  const ks = new Set([...Object.keys(S.days), ...Object.keys(S.red)]);
  const dias = [...ks].filter(studied).length;
  let tq = 0, tok = 0;
  for (const d of Object.values(S.days)){ tq += d.q || 0; tok += d.ok || 0; }
  const rev = Object.values(S.qs).filter(r => r.due).length;
  const by = {}; ORDEM.forEach(c => by[c] = {n:0, ok:0});
  for (const c in S.ar) if (by[c]){ by[c].n += S.ar[c].n; by[c].ok += S.ar[c].ok; }
  EDS.forEach(e => { const st = S.pr[e.id]; if (!st) return; for (const q in st.c){ const a = st.a[q], k = e.k[+q - 1], b = by[e.s[+q - 1]]; if (!b || !a || k === 'X') continue; b.n++; if (a === k) b.ok++; } });
  const rows = ORDEM.map(c => { const b = by[c], p = b.n ? pct(b.ok, b.n) : null;
    return `<div><div class="bar-top"><span>${MAT[c]}</span><span class="num">${p == null ? 'sem dados' : `${p}% · ${b.ok}/${b.n}`}</span></div><div class="track"><i style="width:${p || 0}%"></i></div></div>`; }).join('');
  let w = null; ORDEM.forEach(c => { const b = by[c]; if (b.n >= 3){ const p = b.ok / b.n; if (!w || p < w.p) w = {c, p}; } });
  const sims = S.sims.slice(0, 10).map(s => `<li><span>${fmtD(s.date)} · ${s.n} itens · ${s.c}C ${s.w}E ${s.b}Br</span><b>${s.net}</b></li>`).join('');
  const eds = EDS.map(e => { const p = prStats(e.id); return p.n ? `<li><span>${e.nome} · ${p.n} itens</span><b>${p.net}</b></li>` : ''; }).join('');
  return `<header class="hero"><p class="eyebrow">Progresso</p><h1 class="h1-sm">Como você está indo</h1></header>
    <div class="tiles">
      <div class="tile"><b>${dias}</b><span>dias estudados</span></div>
      <div class="tile"><b>${tq}</b><span>itens do app</span></div>
      <div class="tile"><b>${tq ? pct(tok, tq) + '%' : '—'}</b><span>de acerto no app</span></div>
      <div class="tile"><b>${rev}</b><span>para revisar</span></div>
    </div>
    ${w ? `<section class="card"><p class="eyebrow">Ponto para reforçar</p><p><b>${MAT[w.c]}</b>: ${Math.round(w.p * 100)}% de acerto. ${esc(DICA_MAT[w.c])}</p></section>` : ''}
    <section class="card"><h2 class="h-sm">Acerto por matéria (app + provas oficiais)</h2><div class="bars">${rows}</div></section>
    <section class="card"><h2 class="h-sm">Simulados</h2>${sims ? `<ul class="plain">${sims}</ul>` : '<p class="meta">Nenhum ainda. Aos domingos o app sugere um simulado de 20 itens.</p>'}</section>
    <section class="card"><h2 class="h-sm">Provas oficiais (nota líquida)</h2>${eds ? `<ul class="plain">${eds}</ul>` : '<p class="meta">Nenhuma corrigida ainda.</p>'}</section>
    <p class="meta">Itens do app já vistos: ${Object.keys(S.qs).length} de ${Q.length}. O progresso fica salvo neste aparelho.</p>
    <button class="link danger" id="reset" data-act="reset">${resetArm ? 'Toque de novo para apagar tudo' : 'Apagar meu progresso'}</button>`;
}

function render(){
  const full = !!(sess || sim);
  nav.hidden = full;
  app.innerHTML = sess ? (sess.end ? viewDailyEnd() : viewDaily())
    : sim ? (sim.end ? viewSimEnd() : viewSim())
    : tab === 'hoje' ? viewHome() : tab === 'simulados' ? viewSimulados() : tab === 'padroes' ? viewPadroes() : viewProgresso();
  nav.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-current', !full && b.dataset.tab === tab ? 'page' : 'false'));
  tick();
}
function fmtLeft(t0, dur){ const rem = dur - Math.floor((Date.now() - t0) / 1000); return rem <= 0 ? 'tempo ✓' : Math.floor(rem / 60) + ':' + pad(rem % 60); }
function tick(){ document.querySelectorAll('.timer[data-t0]').forEach(el => { el.textContent = fmtLeft(+el.dataset.t0, +el.dataset.dur); }); }

/* ---------- eventos ---------- */
document.addEventListener('click', ev => {
  const tb = ev.target.closest('[data-tab]');
  if (tb){ tab = tb.dataset.tab; resetArm = false; render(); scrollTo(0, 0); return; }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'start'){
    const f = FOCO[parseKey(today()).getDay()];
    startDaily(+b.dataset.n || 12, f ? f.areas : [], !!b.dataset.rev);
  } else if (act === 'ce'){
    const v = b.dataset.v;
    if (sess && !sess.revealed){
      sess.chosen = v;
      app.querySelectorAll('.ce').forEach(x => { const on = x.dataset.v === v; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
      $('#confirmar').disabled = false;
    } else if (sim && !sim.end){
      const id = sim.ids[sim.i];
      if (v === 'B' || sim.ans[id] === v) delete sim.ans[id]; else sim.ans[id] = v;
      const cur = sim.ans[id] || 'B';
      app.querySelectorAll('.ce').forEach(x => { const on = x.dataset.v === cur && cur !== 'B'; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
      const pr = app.querySelector('.qprog span'); if (pr) pr.textContent = `${sim.i + 1} de ${sim.ids.length} · ${Object.keys(sim.ans).length} marcados`;
    }
  } else if (act === 'confirm'){
    if (sess.chosen == null || sess.revealed) return;
    const q = QM[sess.ids[sess.i]], ok = sess.chosen === q.g;
    sess.revealed = true; sess.res.push({id:q.id, ok}); record(q, ok); bumpDay('q', ok ? 1 : 0, 1); save(); render();
  } else if (act === 'next'){
    sess.i++;
    if (sess.i >= sess.ids.length) sess.end = true; else { sess.chosen = null; sess.revealed = false; }
    render(); scrollTo(0, 0);
  } else if (act === 'quit'){
    if (sess.res.length) sess.end = true; else sess = null;
    render(); scrollTo(0, 0);
  } else if (act === 'home'){
    sess = null; tab = 'hoje'; render(); scrollTo(0, 0);
  } else if (act === 'sim'){
    startSim(+b.dataset.n || 20);
  } else if (act === 'sim-next' || act === 'sim-prev'){
    sim.i += act === 'sim-next' ? 1 : -1; render(); scrollTo(0, 0);
  } else if (act === 'sim-finish'){
    finishSim(); render(); scrollTo(0, 0);
  } else if (act === 'sim-quit'){
    sim = null; render(); scrollTo(0, 0);
  } else if (act === 'sim-close'){
    sim = null; tab = 'simulados'; render(); scrollTo(0, 0);
  } else if (act === 'sun-prova'){
    tab = 'simulados'; provaSel = {id:'2021', from:56, to:75, t0:Date.now()}; render(); scrollTo(0, 0);
  } else if (act === 'ed-open'){
    provaSel = {id:b.dataset.id, from:1, to:20, t0:Date.now()}; render(); scrollTo(0, 0);
  } else if (act === 'ed-back'){
    provaSel = null; render(); scrollTo(0, 0);
  } else if (act === 'blk'){
    provaSel.from = +b.dataset.f; provaSel.to = +b.dataset.t; provaSel.t0 = Date.now(); render();
  } else if (act === 'mark'){
    const st = prState(provaSel.id), q = +b.dataset.q, l = b.dataset.l;
    if (st.c[q]) return;
    if (st.a[q] === l) delete st.a[q]; else st.a[q] = l;
    save();
    b.closest('.crow').querySelectorAll('.bub-btn').forEach(x => { const on = x.dataset.l === st.a[q]; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
    const c = $('#corrigir'); if (c) c.disabled = false;
  } else if (act === 'corrigir'){
    const e = edById(provaSel.id), st = prState(e.id); let n = 0, ok = 0;
    for (let q = provaSel.from; q <= provaSel.to; q++){ if (st.c[q]) continue; st.c[q] = true; n++; if (pts(e, q, st.a[q]) > 0) ok++; }
    bumpDay('pr', ok, n); save(); render();
    const r = $('#res'); if (r) r.scrollIntoView({block:'start'});
  } else if (act === 'refazer'){
    const st = prState(provaSel.id);
    for (let q = provaSel.from; q <= provaSel.to; q++){ delete st.a[q]; delete st.c[q]; }
    provaSel.t0 = Date.now(); save(); render();
  } else if (act === 'reset'){
    if (!resetArm){ resetArm = true; b.textContent = 'Toque de novo para apagar tudo'; setTimeout(() => { resetArm = false; const r = $('#reset'); if (r) r.textContent = 'Apagar meu progresso'; }, 4000); }
    else { S = fresh(); save(); resetArm = false; render(); }
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'exam-date'){ S.exam = el.value || ''; save(); render(); return; }
  if (el.id === 'chute' && sim){ const id = sim.ids[sim.i]; if (el.checked) sim.chute[id] = true; else delete sim.chute[id]; return; }
  if (el.dataset && el.dataset.red != null){
    const t = today(), r = S.red[t] || [false, false, false];
    r[+el.dataset.red] = el.checked; S.red[t] = r; save(); render();
  }
});

render();
setInterval(tick, 1000);
</script>

</body>
</html>
